<!-- app.html -->
<mat-sidenav-container class="h-screen w-full bg-gray-50">
  <!-- THE SIDEBAR -->
  <mat-sidenav #sidenav mode="side" opened class="w-64 border-r border-gray-200">
    <!-- Header / Logo Area -->
    <div class="p-6 flex items-center gap-3">
      <div class="w-8 h-8 rounded-lg flex items-center justify-center">
        <mat-icon class="text-white text-sm">church</mat-icon>
      </div>
      <span class="font-bold text-lg text-gray-800 tracking-tight">CFCS</span>
    </div>

    <!-- Navigation Links -->
    <mat-nav-list>
      <!-- Active Link Example -->
      <a
        mat-list-item
        routerLink="/directory"
        routerLinkActive="!bg-blue-50 !border-r-4 !border-blue-600"
        class="hover:bg-gray-50"
      >
        <mat-icon matListItemIcon class="text-blue-600">people</mat-icon>
        <span class="text-blue-900 font-medium">Directory</span>
      </a>

      <a mat-list-item href="#">
        <mat-icon matListItemIcon class="text-gray-400">volunteer_activism</mat-icon>
        <span class="text-gray-600">Stewardship</span>
      </a>

      <a mat-list-item href="#">
        <mat-icon matListItemIcon class="text-gray-400">bar_chart</mat-icon>
        <span class="text-gray-600">Reports</span>
      </a>

      <mat-divider class="!my-4"></mat-divider>

      <a mat-list-item href="#">
        <mat-icon matListItemIcon class="text-gray-400">settings</mat-icon>
        <span class="text-gray-600">Settings</span>
      </a>
    </mat-nav-list>
  </mat-sidenav>

  <!-- THE MAIN CONTENT -->
  <mat-sidenav-content class="flex flex-col h-full">
    <!-- Optional: Top Toolbar (Mobile Toggle) -->
    <mat-toolbar class="bg-white border-b border-gray-200 !px-8 flex justify-start md:hidden">
      <button mat-icon-button (click)="sidenav.toggle()">
        <mat-icon>menu</mat-icon>
      </button>
      <span>CFCS</span>
    </mat-toolbar>

    <!-- Main View -->
    <main class="p-6 md:p-6 flex-1 overflow-y-auto">
      <router-outlet></router-outlet>
    </main>
  </mat-sidenav-content>
</mat-sidenav-container>
