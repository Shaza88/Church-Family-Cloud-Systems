<!-- app.html -->
<ng-container *ngIf="authStore.isAuthenticated(); else publicLayout">
  <mat-sidenav-container class="h-screen w-full bg-gray-50">
    <!-- THE SIDEBAR -->
    <mat-sidenav #sidenav mode="side" [opened]="true" class="w-64 border-r border-gray-200">
      <!-- Header / Logo Area -->
      <div class="p-6 flex items-center gap-3">
        <div class="w-8 h-8 rounded-lg flex items-center justify-center">
          <mat-icon class="text-white text-sm">church</mat-icon>
        </div>
        <span class="font-bold text-lg text-gray-800 tracking-tight">CFCS</span>
      </div>

      <!-- Navigation Links -->
      <mat-nav-list>
        <!-- Active Link Example -->
        <a
          mat-list-item
          routerLink="/directory"
          routerLinkActive="bg-blue-50 border-r-4 border-blue-600"
          class="hover:bg-gray-50"
        >
          <mat-icon matListItemIcon class="text-blue-600">people</mat-icon>
          <span class="text-blue-900 font-medium">Directory</span>
        </a>

        <a mat-list-item href="#">
          <mat-icon matListItemIcon class="text-gray-400">volunteer_activism</mat-icon>
          <span class="text-gray-600">Stewardship</span>
        </a>

        <a
          mat-list-item
          routerLink="/donations/batch-entry"
          routerLinkActive="bg-blue-50 border-r-4 border-blue-600"
          class="hover:bg-gray-50"
        >
          <mat-icon matListItemIcon class="text-blue-600">post_add</mat-icon>
          <span class="text-blue-900 font-medium">Batch Entry</span>
        </a>

        <a mat-list-item href="#">
          <mat-icon matListItemIcon class="text-gray-400">bar_chart</mat-icon>
          <span class="text-gray-600">Reports</span>
        </a>

        <mat-divider class="!my-4"></mat-divider>

        <a
          mat-list-item
          routerLink="/admin"
          routerLinkActive="bg-blue-50 border-r-4 border-blue-600"
          class="hover:bg-gray-50"
          *appHasPermission="'roles.view'"
        >
          <mat-icon matListItemIcon class="text-gray-400">security</mat-icon>
          <span class="text-gray-600">Administration</span>
        </a>

        <a
          mat-list-item
          routerLink="/settings"
          routerLinkActive="bg-blue-50 border-r-4 border-blue-600"
          class="hover:bg-gray-50"
        >
          <mat-icon matListItemIcon class="text-gray-400">settings</mat-icon>
          <span class="text-gray-600">Settings</span>
        </a>
      </mat-nav-list>
    </mat-sidenav>

    <!-- THE MAIN CONTENT -->
    <mat-sidenav-content class="flex flex-col h-full bg-gray-50">
      <!-- Top Toolbar (Always Visible) -->
      <mat-toolbar
        class="bg-white border-b border-gray-200 px-6 flex justify-between items-center shadow-sm z-10"
      >
        <div class="flex items-center gap-4">
          <button mat-icon-button (click)="sidenav.toggle()" class="md:hidden">
            <mat-icon>menu</mat-icon>
          </button>
          <!-- Breadcrumb or Title Placeholder -->
          <span class="text-sm font-medium text-gray-500 hidden md:block"
            >Church Family Cloud Systems</span
          >
          <span class="font-bold text-gray-800 tracking-tight md:hidden">CFCS</span>
        </div>

        <!-- User Profile & Actions -->
        <div class="flex items-center gap-4">
          <span class="text-sm text-gray-600 hidden sm:block"
            >Welcome, <strong>{{ authStore.username() }}</strong></span
          >

          <button mat-icon-button [matMenuTriggerFor]="userMenu" class="!overflow-visible">
            <img
              [src]="
                authStore.userAvatar() || 'https://ui-avatars.com/api/?name=' + authStore.username()
              "
              class="w-9 h-9 rounded-full border border-gray-200 shadow-sm"
              alt="User Avatar"
            />
          </button>
          <mat-menu #userMenu="matMenu" class="mt-2">
            <button mat-menu-item disabled>
              <mat-icon>account_circle</mat-icon>
              <span>Profile</span>
            </button>
            <button mat-menu-item (click)="openChangePasswordDialog()">
              <mat-icon>lock_reset</mat-icon>
              <span>Change Password</span>
            </button>
            <mat-divider></mat-divider>
            <button mat-menu-item (click)="logout()">
              <mat-icon>logout</mat-icon>
              <span>Logout</span>
            </button>
          </mat-menu>
        </div>
      </mat-toolbar>

      <!-- Main View -->
      <main class="p-6 md:p-6 flex-1 overflow-y-auto">
        <router-outlet></router-outlet>
      </main>
    </mat-sidenav-content>
  </mat-sidenav-container>
</ng-container>

<ng-template #publicLayout>
  <router-outlet></router-outlet>
</ng-template>
