<div class="container mx-auto p-4 md:p-6 max-w-7xl">
  <app-page-header title="Settings" subtitle="System configuration and tools"></app-page-header>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <!-- Lookups Management Card -->
    <mat-card
      class="hover:shadow-lg transition-shadow cursor-pointer h-full flex flex-col"
      routerLink="/settings/lookups"
    >
      <mat-card-header>
        <div
          mat-card-avatar
          class="bg-blue-100 flex items-center justify-center rounded-full text-blue-600"
        >
          <mat-icon>list_alt</mat-icon>
        </div>
        <mat-card-title>Manage Lookups</mat-card-title>
        <mat-card-subtitle>System Dropdowns</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content class="pt-4 flex-1">
        <p class="text-gray-600">
          Customize drop-down values for Genders, Statuses, and Professions used across the system.
        </p>
      </mat-card-content>
      <mat-card-actions align="end">
        <button mat-button color="primary">Manage Lookups</button>
      </mat-card-actions>
    </mat-card>

    <!-- Roles & Permissions Card (Admin Only) -->
    <mat-card
      class="hover:shadow-lg transition-shadow cursor-pointer h-full flex flex-col"
      routerLink="/admin"
      *appHasPermission="'roles.view'"
    >
      <mat-card-header>
        <div
          mat-card-avatar
          class="bg-indigo-100 flex items-center justify-center rounded-full text-indigo-600"
        >
          <mat-icon>security</mat-icon>
        </div>
        <mat-card-title>Administration</mat-card-title>
        <mat-card-subtitle>Security & Users</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content class="pt-4 flex-1">
        <p class="text-gray-600">
          Manage system roles, permissions, user accounts, and security settings.
        </p>
      </mat-card-content>
      <mat-card-actions align="end">
        <button mat-button color="primary">Go to Admin</button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
