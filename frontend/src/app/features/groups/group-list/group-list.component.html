<div class="container mx-auto p-4 md:p-6 max-w-7xl">
  <app-page-header title="Groups & Ministries" subtitle="Manage functional teams and study groups">
    <button mat-flat-button color="primary" (click)="openGroupDialog()">
      <mat-icon>group_add</mat-icon> New Group
    </button>
  </app-page-header>

  <div class="bg-white rounded-lg shadow-sm border border-gray-200 mt-6 relative">
    <div class="overflow-x-auto">
      <table mat-table [dataSource]="groupStore.groups()" class="w-full">
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef> Name </th>
          <td mat-cell *matCellDef="let group" class="font-medium text-blue-900 border-b border-gray-100 whitespace-nowrap">
            {{ group.name }}
          </td>
        </ng-container>

        <ng-container matColumnDef="meetingTime">
          <th mat-header-cell *matHeaderCellDef> Meeting Time </th>
          <td mat-cell *matCellDef="let group" class="border-b border-gray-100 text-gray-600 whitespace-nowrap">
            <mat-icon class="text-[16px] w-[16px] h-[16px] inline align-text-bottom mr-1 text-gray-400">event</mat-icon>
            {{ group.meetingTime }}
          </td>
        </ng-container>

        <ng-container matColumnDef="description">
          <th mat-header-cell *matHeaderCellDef> Description </th>
          <td mat-cell *matCellDef="let group" class="border-b border-gray-100 text-gray-500 truncate max-w-xs">
            {{ group.description }}
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef class="w-[80px]"></th>
          <td mat-cell *matCellDef="let group" class="text-right border-b border-gray-100">
            <button mat-icon-button [matMenuTriggerFor]="menu" (click)="$event.stopPropagation()">
              <mat-icon>more_vert</mat-icon>
            </button>
            <mat-menu #menu="matMenu">
              <button mat-menu-item (click)="viewGroup(group)">
                <mat-icon>visibility</mat-icon>
                <span>View Roster</span>
              </button>
              <button mat-menu-item (click)="openGroupDialog(group)">
                <mat-icon>edit</mat-icon>
                <span>Edit Group</span>
              </button>
              <mat-divider></mat-divider>
              <button mat-menu-item class="!text-red-600" (click)="deleteGroup(group)">
                <mat-icon class="!text-red-600">delete</mat-icon>
                <span>Delete</span>
              </button>
            </mat-menu>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-gray-50 transition-colors cursor-pointer" (click)="viewGroup(row)"></tr>
        
        <tr class="mat-row" *matNoDataRow>
          <td class="mat-cell text-center py-8 text-gray-500" [attr.colspan]="displayedColumns.length">
            @if (groupStore.loading()) {
              Loading...
            } @else {
              No groups found. Create a new ministry group above.
            }
          </td>
        </tr>
      </table>
    </div>
  </div>
</div>
