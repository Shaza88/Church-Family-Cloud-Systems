<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-xl font-bold text-gray-800 m-0">Stewardship Records</h2>
    <button mat-flat-button color="primary" (click)="openAddStewardshipDialog()" [disabled]="stewardshipStore.saving()">
      <mat-icon>add</mat-icon> Add Stewardship
    </button>
  </div>

  @if (stewardshipStore.stewardships().length > 0) {
    <div class="border border-gray-200 rounded-lg overflow-hidden bg-white">
      <table mat-table [dataSource]="stewardshipStore.stewardships()" class="w-full">
        <!-- Fiscal Year Column -->
        <ng-container matColumnDef="fiscalYear">
          <th mat-header-cell *matHeaderCellDef>Fiscal Year</th>
        <td mat-cell *matCellDef="let stewardship">{{ stewardship.fiscalYear }}</td>
      </ng-container>

      <!-- Amount Column -->
      <ng-container matColumnDef="amount">
        <th mat-header-cell *matHeaderCellDef>Amount</th>
        <td mat-cell *matCellDef="let stewardship">{{ stewardship.amount | currency }}</td>
      </ng-container>

      <!-- Frequency Column -->
      <ng-container matColumnDef="frequency">
        <th mat-header-cell *matHeaderCellDef>Frequency</th>
        <td mat-cell *matCellDef="let stewardship">{{ stewardship.frequency }}</td>
      </ng-container>

      <!-- Total Yearly Column -->
      <ng-container matColumnDef="totalYearly">
        <th mat-header-cell *matHeaderCellDef>Total Yearly</th>
        <td mat-cell *matCellDef="let stewardship" class="font-semibold text-gray-700">
          {{ stewardship.totalYearlyAmount | currency }}
        </td>
      </ng-container>

      <!-- Status Column -->
      <ng-container matColumnDef="status">
        <th mat-header-cell *matHeaderCellDef>Status</th>
        <td mat-cell *matCellDef="let stewardship">
          <mat-chip-set>
            <mat-chip
              [class.bg-green-100]="stewardship.status === 'Active'"
              [class.text-green-800]="stewardship.status === 'Active'"
              [class.bg-gray-100]="stewardship.status === 'Completed'"
              [class.text-gray-800]="stewardship.status === 'Completed'"
              [class.bg-red-100]="stewardship.status === 'Cancelled'"
              [class.text-red-800]="stewardship.status === 'Cancelled'"
              class="border-none"
            >
              {{ stewardship.status }}
            </mat-chip>
          </mat-chip-set>
        </td>
      </ng-container>

      <!-- Actions Column -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef class="text-right"></th>
        <td mat-cell *matCellDef="let stewardship" class="text-right">
          <button mat-icon-button color="primary" matTooltip="Edit Stewardship" (click)="openEditStewardshipDialog(stewardship)">
            <mat-icon>edit</mat-icon>
          </button>
          <button mat-icon-button color="warn" matTooltip="Delete Stewardship" (click)="deleteStewardship(stewardship)">
            <mat-icon>delete</mat-icon>
          </button>
        </td>
      </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns" class="bg-gray-50/50"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns" class="hover:bg-gray-50/50 transition-colors"></tr>
      </table>
    </div>
  } @else {
    <app-empty-state
      [bordered]="true"
      icon="savings"
      title="No stewardship records found for this household."
      message="Click 'Add Stewardship' to record their intended giving."
      actionText="Add Stewardship"
      actionIcon="add"
      (actionClick)="openAddStewardshipDialog()">
    </app-empty-state>
  }
</div>
