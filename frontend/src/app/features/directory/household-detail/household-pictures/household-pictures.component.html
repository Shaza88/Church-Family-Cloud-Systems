<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-xl font-bold text-gray-800 m-0">Pictures</h2>
    <input #fileInput type="file" hidden (change)="onFileSelected($event)" accept="image/*" />
    <button mat-flat-button color="primary" (click)="uploadPicture(fileInput)">
      <mat-icon>add_a_photo</mat-icon> Upload Picture
    </button>
  </div>

  @if (pictures().length > 0) {
    <div class="bg-white rounded-lg border border-gray-200 overflow-hidden">
      <table mat-table [dataSource]="pictures()" class="w-full">
        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let pic">
            <div class="flex items-center gap-3">
              <img [src]="pic.url" alt="Thumbnail" class="w-10 h-10 object-cover rounded shadow-sm border border-gray-200">
              <span class="font-medium text-gray-700">{{ pic.name }}</span>
            </div>
          </td>
        </ng-container>

        <!-- Date Column -->
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Date Added</th>
          <td mat-cell *matCellDef="let pic">{{ pic.date | date }}</td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let pic">
            <button mat-icon-button color="primary">
              <mat-icon>download</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deletePicture(pic)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  } @else {
    <div
      class="flex flex-col items-center justify-center p-12 bg-gray-50 border border-dashed border-gray-300 rounded-lg text-center"
    >
      <mat-icon class="text-gray-400 text-5xl w-12 h-12 mb-4 !leading-none !font-size-5xl"
        >photo_library</mat-icon
      >
      <h3 class="text-lg font-medium text-gray-700">No photos yet</h3>
      <p class="text-gray-500 max-w-sm mt-1">
        Upload family photos or generic household images here.
      </p>
      <button mat-stroked-button class="mt-4" (click)="uploadPicture(fileInput)">
        Upload Picture
      </button>
    </div>
  }
</div>
