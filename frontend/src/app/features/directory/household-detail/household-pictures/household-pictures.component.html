<div class="p-6">
  <div class="flex justify-between items-center mb-6">
    <h2 class="text-xl font-bold text-gray-800 m-0">Pictures</h2>
    <input #fileInput type="file" hidden (change)="onFileSelected($event)" accept="image/*" />
    <button mat-flat-button color="primary" (click)="uploadPicture(fileInput)">
      <mat-icon>add_a_photo</mat-icon> Upload Picture
    </button>
  </div>

  @if (pictures().length > 0) {
    <div class="bg-white rounded-lg border border-gray-200 overflow-hidden">
      <table mat-table [dataSource]="pictures()" class="w-full">
        <!-- Name Column -->
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Name</th>
          <td mat-cell *matCellDef="let pic">
            <div class="flex items-center gap-3">
              <img [src]="pic.url" alt="Thumbnail" class="w-10 h-10 object-cover rounded shadow-sm border border-gray-200">
              <span class="font-medium text-gray-700">{{ pic.name }}</span>
            </div>
          </td>
        </ng-container>

        <!-- Date Column -->
        <ng-container matColumnDef="date">
          <th mat-header-cell *matHeaderCellDef>Date Added</th>
          <td mat-cell *matCellDef="let pic">{{ pic.date | date }}</td>
        </ng-container>

        <!-- Actions Column -->
        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let pic">
            <button mat-icon-button color="primary">
              <mat-icon>download</mat-icon>
            </button>
            <button mat-icon-button color="warn" (click)="deletePicture(pic)">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
      </table>
    </div>
  } @else {
    <app-empty-state
      [bordered]="true"
      icon="photo_library"
      title="No photos yet"
      message="Upload family photos or generic household images here."
      actionText="Upload Picture"
      actionIcon="add_a_photo"
      (actionClick)="uploadPicture(fileInput)">
    </app-empty-state>
  }
</div>
