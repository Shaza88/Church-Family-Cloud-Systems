<div class="p-4 md:p-4 max-w-6xl mx-auto">
  <div class="mb-6">
    <h1 class="text-2xl md:text-3xl font-bold text-gray-800 mb-4">Directory</h1>

    <!-- Advanced Search Panel -->
    <mat-expansion-panel class="!mb-8 shadow-sm border border-gray-200 !rounded-lg overflow-hidden">
      <mat-expansion-panel-header>
        <mat-panel-title class="text-gray-600 font-medium flex items-center">
          <mat-icon class="mr-2 text-gray-400">filter_list</mat-icon>
          Advanced Search
        </mat-panel-title>
      </mat-expansion-panel-header>

      <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4 pt-4">
        <!-- Status -->
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Status</mat-label>
          <mat-select [(ngModel)]="advancedFilters.status">
            <mat-option value="">All</mat-option>
            <mat-option *ngFor="let s of lookupStore.statuses()" [value]="s.value">{{
              s.value
            }}</mat-option>
          </mat-select>
        </mat-form-field>

        <!-- Profession -->
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Profession</mat-label>
          <input matInput [(ngModel)]="advancedFilters.profession" placeholder="Ex. Engineer" />
        </mat-form-field>

        <!-- City -->
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>City</mat-label>
          <input matInput [(ngModel)]="advancedFilters.city" placeholder="Ex. Wayne" />
        </mat-form-field>

        <!-- Zip -->
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Zip Code</mat-label>
          <input matInput [(ngModel)]="advancedFilters.zip" placeholder="Ex. 19087" />
        </mat-form-field>

        <!-- Email -->
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Email</mat-label>
          <input matInput [(ngModel)]="advancedFilters.email" placeholder="Ex. john@example.com" />
        </mat-form-field>

        <!-- Phone -->
        <mat-form-field appearance="outline" class="w-full">
          <mat-label>Phone</mat-label>
          <input matInput [(ngModel)]="advancedFilters.phone" placeholder="Ex. 555-0123" />
        </mat-form-field>
      </div>

      <div class="flex justify-end gap-3 pb-2 mt-2">
        <button mat-button (click)="clearAdvancedFilter()">Clear Filters</button>
        <button mat-flat-button color="primary" (click)="applyAdvancedFilter()">
          Apply Filters
        </button>
      </div>
    </mat-expansion-panel>

    <div class="flex flex-col sm:flex-row justify-between items-center gap-4 w-full">
      <!-- Add Household Button (Left) -->
      <button
        mat-flat-button
        color="primary"
        class="h-[56px] w-full sm:w-auto"
        (click)="openAddDialog()"
      >
        <mat-icon>add</mat-icon> Add Household
      </button>

      <!-- Search Field (Right) -->
      <mat-form-field appearance="outline" class="w-full sm:w-[400px] !m-0">
        <mat-label>Search households...</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Smith" />
        <mat-icon matSuffix>search</mat-icon>
      </mat-form-field>
    </div>
  </div>

  <div class="mat-elevation-z8 rounded-lg overflow-hidden flex flex-col">
    <div class="overflow-x-auto">
      <table
        mat-table
        [dataSource]="store.households()"
        matSort
        (matSortChange)="onSortChange($event)"
        class="w-full min-w-[600px] md:min-w-full"
      >
        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="name" class="px-4">Name</th>
          <td mat-cell *matCellDef="let element" class="px-4">
            <div class="flex flex-col py-2">
              <span class="font-medium text-base">
                <strong>{{ element.name }}</strong>
              </span>
              <div class="text-xs text-gray-500">{{ element.address | address }}</div>
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef mat-sort-header="status">Status</th>
          <td mat-cell *matCellDef="let element">
            <span
              class="px-2 py-1 rounded-full text-xs font-medium"
              [ngClass]="{
                'bg-green-100 text-green-800': element.status === 'Active',
                'bg-yellow-100 text-yellow-800': element.status === 'Visitor',
                'bg-gray-100 text-gray-800': element.status === 'Inactive',
              }"
            >
              {{ element.status }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="members">
          <th mat-header-cell *matHeaderCellDef class="hidden sm:table-cell">Members</th>
          <td mat-cell *matCellDef="let element" class="hidden sm:table-cell">
            <div class="flex items-center gap-1">
              <mat-icon class="text-gray-400 text-sm h-4 w-4">group</mat-icon>
              {{ element.memberCount }}
            </div>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef>Actions</th>
          <td mat-cell *matCellDef="let element">
            <button mat-icon-button color="primary" (click)="openEditDialog(element)">
              <mat-icon>edit</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
        <tr
          mat-row
          *matRowDef="let row; columns: displayedColumns"
          class="hover:bg-gray-50 transition-colors"
        ></tr>
      </table>
    </div>
    <mat-paginator
      [length]="store.total()"
      [pageSize]="store.pageSize()"
      [pageIndex]="store.pageIndex()"
      [pageSizeOptions]="[5, 10, 25, 100]"
      (page)="onPageChange($event)"
      showFirstLastButtons
    ></mat-paginator>
  </div>
</div>
