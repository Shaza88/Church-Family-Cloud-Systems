<div class="p-4 md:p-8 max-w-6xl mx-auto">
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4 sm:gap-0">
        <h1 class="text-2xl md:text-3xl font-bold text-gray-800">Directory</h1>
        <button mat-raised-button color="primary" class="w-full sm:w-auto">
            <mat-icon>add</mat-icon> Add Family
        </button>
    </div>

    <mat-form-field appearance="outline" class="w-full mb-4">
        <mat-label>Search households...</mat-label>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ex. Smith">
        <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>

    <div class="mat-elevation-z8 rounded-lg overflow-hidden flex flex-col">
        <div class="overflow-x-auto">
            <table mat-table [dataSource]="store.filteredHouseholds()" class="w-full min-w-[600px] md:min-w-full">

                <ng-container matColumnDef="name">
                    <th mat-header-cell *matHeaderCellDef class="px-4"> Name </th>
                    <td mat-cell *matCellDef="let element" class="px-4">
                        <div class="flex flex-col py-2">
                            <span class="font-medium text-base">{{element.name}}</span>
                            <div class="text-xs text-gray-500">{{element.address}}</div>
                        </div>
                    </td>
                </ng-container>

                <ng-container matColumnDef="status">
                    <th mat-header-cell *matHeaderCellDef> Status </th>
                    <td mat-cell *matCellDef="let element">
                        <span class="px-2 py-1 rounded-full text-xs font-medium" [ngClass]="{
                                'bg-green-100 text-green-800': element.status === 'Active',
                                'bg-yellow-100 text-yellow-800': element.status === 'Visitor',
                                'bg-gray-100 text-gray-800': element.status === 'Inactive'
                              }">
                            {{element.status}}
                        </span>
                    </td>
                </ng-container>

                <ng-container matColumnDef="members">
                    <th mat-header-cell *matHeaderCellDef class="hidden sm:table-cell"> Members </th>
                    <td mat-cell *matCellDef="let element" class="hidden sm:table-cell">
                        <div class="flex items-center gap-1">
                            <mat-icon class="text-gray-400 text-sm h-4 w-4"
                                style="font-size: 16px; width: 16px; height: 16px; line-height: 16px;">group</mat-icon>
                            {{element.memberCount}}
                        </div>
                    </td>
                </ng-container>

                <ng-container matColumnDef="actions">
                    <th mat-header-cell *matHeaderCellDef> Actions </th>
                    <td mat-cell *matCellDef="let element">
                        <button mat-icon-button color="primary"><mat-icon>edit</mat-icon></button>
                    </td>
                </ng-container>

                <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
                <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-gray-50 transition-colors">
                </tr>
            </table>
        </div>
    </div>
</div>
