<div class="container mx-auto p-4 md:p-6 max-w-7xl">
  <app-page-header
    title="Admin Dashboard"
    subtitle="Manage system security and configuration"
  ></app-page-header>

  <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
    <!-- Role Management Card -->
    <mat-card
      class="hover:shadow-lg transition-shadow cursor-pointer"
      routerLink="roles"
      *appHasPermission="'roles.view'"
    >
      <mat-card-header>
        <div
          mat-card-avatar
          class="bg-indigo-100 flex items-center justify-center rounded-full text-indigo-600"
        >
          <mat-icon>security</mat-icon>
        </div>
        <mat-card-title>Role Management</mat-card-title>
        <mat-card-subtitle>Configure roles & permissions</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content class="pt-4">
        <p class="text-gray-600">
          Create and edit user roles. Assign specific granular permissions to each role to control
          access levels.
        </p>
      </mat-card-content>
      <mat-card-actions align="end">
        <button mat-button color="primary">Manage Roles</button>
      </mat-card-actions>
    </mat-card>

    <!-- User Management Card -->
    <mat-card
      class="hover:shadow-lg transition-shadow cursor-pointer"
      routerLink="users"
      *appHasPermission="'roles.view'"
    >
      <mat-card-header>
        <div
          mat-card-avatar
          class="bg-green-100 flex items-center justify-center rounded-full text-green-600"
        >
          <mat-icon>people</mat-icon>
        </div>
        <mat-card-title>User Management</mat-card-title>
        <mat-card-subtitle>Manage system users</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content class="pt-4">
        <p class="text-gray-600">
          Create new users, update profiles, and assign roles to control access levels.
        </p>
      </mat-card-content>
      <mat-card-actions align="end">
        <button mat-button color="primary">Manage Users</button>
      </mat-card-actions>
    </mat-card>
  </div>
</div>
