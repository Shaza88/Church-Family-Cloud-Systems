<div class="container mx-auto p-4 md:p-6 max-w-7xl">
  <app-page-header title="Deposit Batches" subtitle="View historical deposits and create new batches">
    <div class="flex gap-2">
      <button mat-stroked-button (click)="exportCsv()" matTooltip="Download current table view as CSV">
        <mat-icon>download</mat-icon> Export to CSV
      </button>
      <button mat-flat-button color="primary" (click)="createNewBatch()">
        <mat-icon>add</mat-icon> New Batch
      </button>
    </div>
  </app-page-header>

  <div class="bg-white rounded-lg shadow-sm border border-gray-200 mt-6">
    <!-- Filtering Header -->
    <div class="px-6 py-4 border-b border-gray-200">
      <mat-form-field appearance="outline" class="w-full md:w-96 m-0" subscriptSizing="dynamic">
        <mat-label>Search batches...</mat-label>
        <mat-icon matPrefix>search</mat-icon>
        <input matInput (keyup)="applyFilter($event)" placeholder="Ex: System, Posted, 2024..." #input />
      </mat-form-field>
    </div>

    <!-- Loading State -->
    @if (batchStore.isLoading()) {
      <div class="flex justify-center items-center p-12">
        <mat-spinner diameter="40"></mat-spinner>
      </div>
    } @else {
      <!-- Data Table -->
      <div class="overflow-x-auto min-h-[300px]">
        <table mat-table [dataSource]="dataSource" matSort class="w-full">
          
          <!-- Date Column -->
          <ng-container matColumnDef="date">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Date </th>
            <td mat-cell *matCellDef="let batch" class="font-medium text-gray-900">
              {{ batch.date | date:'mediumDate' }}
            </td>
          </ng-container>

          <!-- Status Column -->
          <ng-container matColumnDef="status">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Status </th>
            <td mat-cell *matCellDef="let batch">
              <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-semibold"
                [ngClass]="batch.status === 'Posted' ? 'bg-green-100 text-green-800' : 'bg-blue-100 text-blue-800'">
                {{ batch.status }}
              </span>
            </td>
          </ng-container>

          <!-- Expected Total Column -->
          <ng-container matColumnDef="expectedTotal">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Expected </th>
            <td mat-cell *matCellDef="let batch" class="text-gray-500 font-mono">
              {{ batch.expectedTotal | currency }}
            </td>
          </ng-container>

          <!-- Actual Total Column -->
          <ng-container matColumnDef="actualTotal">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> Balanced </th>
            <td mat-cell *matCellDef="let batch" class="font-mono font-medium" 
                [ngClass]="batch.status === 'Open' ? (batch.actualTotal === batch.expectedTotal ? 'text-green-600' : 'text-amber-600') : 'text-gray-900'">
              {{ batch.actualTotal | currency }}
            </td>
          </ng-container>

          <!-- Donation Count Column -->
          <ng-container matColumnDef="donationCount">
            <th mat-header-cell *matHeaderCellDef mat-sort-header> # Items </th>
            <td mat-cell *matCellDef="let batch" class="text-gray-500 text-center">
              {{ batch.donationCount }}
            </td>
          </ng-container>

          <!-- Created By Column -->
          <ng-container matColumnDef="createdBy">
             <th mat-header-cell *matHeaderCellDef mat-sort-header> Treasurer </th>
             <td mat-cell *matCellDef="let batch" class="text-gray-400 text-sm truncate max-w-[150px]">
               {{ batch.createdBy }}
             </td>
          </ng-container>

          <!-- Actions Column -->
          <ng-container matColumnDef="actions">
            <th mat-header-cell *matHeaderCellDef class="w-[80px]"></th>
            <td mat-cell *matCellDef="let batch" class="text-right">
              <button mat-icon-button color="primary" (click)="$event.stopPropagation(); viewBatch(batch)" [matTooltip]="batch.status === 'Posted' ? 'View Receipt' : 'Resume Entry'">
                <mat-icon>{{ batch.status === 'Posted' ? 'visibility' : 'edit_document' }}</mat-icon>
              </button>
            </td>
          </ng-container>

          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;" class="hover:bg-gray-50 transition-colors cursor-pointer" (click)="viewBatch(row)"></tr>

          <!-- No Data State inside table -->
          <tr class="mat-row" *matNoDataRow>
            <td class="mat-cell p-0 border-b-0" [colSpan]="displayedColumns.length">
              <app-empty-state
                icon="account_balance_wallet"
                title="No deposit batches found"
                message="Click 'New Batch' to initialize a new Sunday deposit sequence."
                actionText="New Batch"
                actionIcon="add"
                (actionClick)="createNewBatch()">
              </app-empty-state>
            </td>
          </tr>
        </table>
        
        <mat-paginator [pageSizeOptions]="[10, 25, 50]" aria-label="Select page of batches"></mat-paginator>
      </div>
    }
  </div>
</div>
